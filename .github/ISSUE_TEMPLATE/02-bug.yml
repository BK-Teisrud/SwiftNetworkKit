name: Bug report
description: A structured bug report without sensitive data.
title: "[Bug report] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: "This repository is public. Use synthetic data; report vulnerabilities privately."
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior and expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version, platform, and environment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction using synthetic data
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Impact and potential regression
    validations:
      required: true
