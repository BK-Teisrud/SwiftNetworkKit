name: Proposal or architecture decision
description: A structured proposal or architecture decision without sensitive data.
title: "[Proposal or architecture decision] "
labels: ["type: decision"]
body:
  - type: markdown
    attributes:
      value: "This repository is public. Use synthetic data; report vulnerabilities privately."
  - type: textarea
    id: problem
    attributes:
      label: Problem and requirement references
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, security, and platforms
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Decision criteria
    validations:
      required: true
