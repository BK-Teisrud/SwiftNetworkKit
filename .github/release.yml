changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Endringer i offentlig API
      labels: ["breaking-change"]
    - title: Nye funksjoner
      labels: ["type: feature"]
    - title: Feilrettinger
      labels: ["type: bug"]
    - title: Dokumentasjon og vedlikehold
      labels: ["*"]
